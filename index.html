<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Ming 今日</title>
<link rel="manifest" href="manifest.json?v=miu-20261001">
<link rel="icon" type="image/png" sizes="192x192" href="icon-miu-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-miu-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ming 今日">
<meta name="theme-color" content="#FFF6EE">
<style>
  :root{
    --bg:#FFF6EE; --card:#FFFFFF; --ink:#2E2A3B; --muted:#8C8599; --line:#F1E6DC; --soft:#FBEFE5;
    --coral:#FF7A6B; --sun:#FFB940; --lav:#9B87F5; --sky:#4FBDEB; --pink:#FF8FBF;
    --coral-soft:#FFE4E0; --sun-soft:#FFF0D2; --lav-soft:#ECE7FF; --sky-soft:#DDF3FC;
    --shadow:0 2px 6px rgba(46,42,59,.05), 0 12px 30px rgba(46,42,59,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1823; --card:#26222F; --ink:#F4EFFA; --muted:#A79FB5; --line:#352F40; --soft:#2E2938;
      --coral-soft:#4A2B2A; --sun-soft:#46381F; --lav-soft:#332C4F; --sky-soft:#1F3A47;
      --shadow:0 2px 6px rgba(0,0,0,.3), 0 12px 30px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink)}
  body{font-family:-apple-system,"PingFang HK",sans-serif; font-size:16px; line-height:1.45; padding-bottom:env(safe-area-inset-bottom); overflow-x:hidden}
  button,input,textarea{font:inherit; color:inherit}
  button{cursor:pointer; border:0; background:none; padding:0}
  .app{max-width:480px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px 120px}
  .hide{display:none!important}

  header.top{display:flex; align-items:center; gap:10px; margin:4px 0 14px}
  header.top h1{font-size:24px; margin:0; flex:1; letter-spacing:-.02em}
  header.top h1 small{display:block; font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0}
  .streak{background:var(--sun-soft); color:#A0620A; border-radius:999px; padding:6px 12px; font-weight:700; font-size:15px; white-space:nowrap}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .streak{color:var(--sun)} }
  .iconbtn{width:40px; height:40px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); font-size:18px}

  .card{background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .card h2{font-size:17px; margin:0 0 12px; display:flex; align-items:center; gap:8px}
  .favs{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; margin:0 -2px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
  .favs::-webkit-scrollbar{display:none}
  .fav{flex:none; width:86px; text-align:center; font-size:12px; font-weight:600}
  .fav .im{width:86px; height:86px; border-radius:20px; background:var(--soft) center/cover; display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:var(--shadow); margin-bottom:4px}
  .fav span{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ringcard{position:relative; padding-top:40px}
  .morebtn{position:absolute; top:12px; right:14px; font-size:13px; font-weight:700; color:var(--muted); background:var(--soft); border-radius:999px; padding:5px 12px}
  .card h2 .more{margin-left:auto; font-size:13px; color:var(--muted); font-weight:500}

  /* three big rings */
  .rings{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center}
  .ring{position:relative}
  .ring svg{width:100%; max-width:118px; height:auto; display:block; margin:0 auto}
  .ring .emo{position:absolute; left:0; right:0; top:0; height:0; padding-top:min(100%,118px); display:flex; align-items:center; justify-content:center}
  .ring .emo span{position:absolute; top:50%; transform:translateY(-50%); font-size:34px}
  .ring b{display:block; font-size:14px; margin-top:4px}
  .ring i{display:block; font-style:normal; font-size:12px; color:var(--muted)}
  .verdict{margin-top:14px; background:var(--soft); border-radius:18px; padding:12px 14px; font-size:16px; font-weight:600}
  .demo{font-size:12px; color:var(--muted); margin-top:8px; text-align:center}

  /* camera button */
  .snap{display:flex; align-items:center; gap:14px; width:100%; border-radius:26px; padding:18px 20px; margin-bottom:14px;
    background:linear-gradient(120deg,var(--coral),var(--pink)); color:#fff; box-shadow:0 10px 26px rgba(255,122,107,.35); text-align:left}
  .snap .cam{font-size:40px}
  .snap b{font-size:20px; display:block}
  .snap span{font-size:13px; opacity:.9}
  .snap:active{transform:scale(.98)}
  .snaprow{display:flex; gap:10px; margin:-4px 0 14px}
  .snaprow button{flex:1; background:var(--card); box-shadow:var(--shadow); border-radius:18px; padding:10px; font-size:14px; font-weight:600}

  /* mood */
  .moods{display:flex; justify-content:space-between}
  .moods button{font-size:34px; width:58px; height:58px; border-radius:20px; background:var(--soft); transition:transform .15s}
  .moods button.on{background:var(--sun-soft); transform:scale(1.12); box-shadow:0 0 0 3px var(--sun)}
  .moodnote{font-size:13px; color:var(--muted); margin-top:10px; text-align:center}

  /* water */
  .water{display:grid; grid-template-columns:repeat(8,1fr); gap:5px}
  .water button{font-size:22px; height:44px; border-radius:14px; background:var(--soft); filter:grayscale(1); opacity:.45}
  .water button.on{filter:none; opacity:1; background:var(--sky-soft)}

  /* photo grid */
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; border-radius:16px; overflow:hidden}
  .grid .ph{aspect-ratio:1; background:var(--soft) center/cover no-repeat; position:relative; display:flex; align-items:center; justify-content:center; font-size:30px}
  .grid .ph .tag{position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.45); color:#fff; font-size:11px; border-radius:8px; padding:1px 6px}
  .grid .ph .heart{position:absolute; right:6px; top:4px; font-size:16px}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:14px 0}
  .kcalline{font-size:14px; color:var(--muted); margin-top:10px}
  .kcalline b{color:var(--ink)}

  /* challenges */
  .ch{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line)}
  .ch:first-of-type{border-top:0}
  .ch .ic{font-size:30px; width:44px; text-align:center}
  .ch .tx{flex:1}
  .ch .tx b{display:block; font-size:15px}
  .dots{display:flex; gap:4px; margin-top:5px}
  .dots i{width:14px; height:14px; border-radius:50%; background:var(--line)}
  .dots i.on{background:var(--lav)}
  .ch .ok{font-size:22px}
  .badges{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; text-align:center}
  .badge{background:var(--lav-soft); border-radius:20px; padding:10px 4px}
  .badge span{font-size:34px; display:block}
  .badge small{font-size:11px; color:var(--muted)}

  /* highlight */
  .hl{display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
  .hl:first-of-type{border-top:0}
  .hl .big{font-size:30px; width:54px; height:54px; border-radius:16px; background:var(--soft) center/cover; display:flex; align-items:center; justify-content:center; flex:none}
  .hl b{display:block}
  .hl span{font-size:13px; color:var(--muted)}

  /* mood x sleep picture */
  .plot{position:relative; height:180px; border-radius:18px; background:linear-gradient(90deg,var(--lav-soft),var(--sky-soft)); margin-top:4px}
  .plot .e{position:absolute; font-size:22px; transform:translate(-50%,50%)}
  .plot .ax{position:absolute; bottom:4px; font-size:11px; color:var(--muted)}

  .btnrow{display:flex; gap:10px}
  .btn{flex:1; border-radius:18px; padding:13px; font-weight:700; background:var(--soft)}
  .btn.primary{background:var(--ink); color:var(--bg)}
  .btn.fun{background:linear-gradient(120deg,var(--lav),var(--sky)); color:#fff}
  .btn:disabled{opacity:.5}

  /* bottom nav */
  nav.tabs{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; gap:4px; background:var(--card); box-shadow:var(--shadow); border-radius:999px; padding:5px; z-index:20}
  nav.tabs button{padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap}
  nav.tabs button.on{background:var(--ink); color:var(--bg)}
  .fab{position:fixed; right:max(16px, calc(50% - 224px)); bottom:calc(76px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; background:var(--lav); color:#fff; font-size:26px; box-shadow:0 10px 24px rgba(155,135,245,.45); z-index:21}

  /* sheet */
  .veil{position:fixed; inset:0; background:rgba(20,16,30,.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:30}
  .veil.show{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:50%; bottom:0; width:100%; max-width:480px; transform:translate(-50%,105%); transition:transform .25s ease; background:var(--bg); border-radius:28px 28px 0 0; padding:18px 16px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; z-index:31}
  .sheet.show{transform:translate(-50%,0)}
  .sheet h3{margin:0 0 12px; font-size:19px; display:flex; align-items:center}
  .sheet h3 .x{margin-left:auto; width:34px; height:34px; border-radius:50%; background:var(--soft); font-size:16px}
  .row{display:flex; align-items:center; gap:10px; background:var(--card); border-radius:18px; padding:10px 12px; margin-bottom:8px}
  .row .nm{flex:1; min-width:0}
  .row .nm b{display:block; font-size:15px}
  .row .nm small{color:var(--muted); font-size:12px}
  .step{display:flex; align-items:center; gap:4px}
  .step button{width:30px; height:30px; border-radius:50%; background:var(--soft); font-weight:700}
  .step input{width:56px; text-align:center; border:1px solid var(--line); border-radius:10px; padding:4px; background:var(--card)}
  .del{color:var(--muted); font-size:18px; width:28px}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
  .chips button{padding:7px 14px; border-radius:999px; background:var(--card); font-size:14px; font-weight:600; box-shadow:var(--shadow)}
  .chips button.on{background:var(--ink); color:var(--bg)}
  .preview{width:100%; max-height:220px; object-fit:cover; border-radius:20px; margin-bottom:12px}
  .field{display:block; margin-bottom:12px}
  .field span{display:block; font-size:13px; color:var(--muted); margin-bottom:4px}
  .field input,.field textarea{width:100%; border:1px solid var(--line); border-radius:14px; padding:10px 12px; background:var(--card)}
  .spinner{text-align:center; padding:30px 0; font-size:15px}
  .spinner .bob{font-size:44px; display:inline-block; animation:bob 1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-10px) rotate(-8deg)}}
  .detail table{width:100%; border-collapse:collapse; font-size:14px}
  .detail td{padding:7px 4px; border-bottom:1px solid var(--line)}
  .detail td:last-child{text-align:right; font-variant-numeric:tabular-nums}
  .detail h4{margin:16px 0 6px; font-size:14px; color:var(--muted)}
  .src{font-size:11px; color:var(--muted); overflow-wrap:anywhere}
  .sheet input,.sheet textarea{min-width:0; max-width:100%}
  .bodyrow{display:flex; gap:8px; margin-top:12px}
  .bodyrow input{flex:1 1 0; width:0; min-width:0; border:1px solid var(--line); border-radius:14px; padding:10px; background:var(--card)}
  .bodyrow button{flex:none; padding:10px 16px}

  /* chat */
  .msgs{display:flex; flex-direction:column; gap:8px; min-height:180px; max-height:52vh; overflow-y:auto; padding:4px 0 10px}
  .msg{max-width:84%; padding:10px 13px; border-radius:18px; font-size:15px; white-space:pre-wrap; word-break:break-word}
  .msg.me{align-self:flex-end; background:var(--lav); color:#fff; border-bottom-right-radius:6px}
  .msg.eva{align-self:flex-start; background:var(--card); border-bottom-left-radius:6px}
  .msg.wait{opacity:.7}
  .msg img{max-width:160px; border-radius:12px; display:block; margin-bottom:6px}
  .compose{display:flex; gap:8px; align-items:flex-end}
  .compose textarea{flex:1; border:1px solid var(--line); border-radius:18px; padding:10px 12px; background:var(--card); resize:none; height:44px}
  .compose button{width:44px; height:44px; border-radius:50%; background:var(--soft); font-size:18px; flex:none}
  .compose button.send{background:var(--ink); color:var(--bg)}

  /* gate */
  .gate{max-width:360px; margin:18vh auto 0; text-align:center; padding:0 16px}
  .gate .logo{font-size:64px}
  .gate input{width:100%; border:1px solid var(--line); border-radius:16px; padding:14px; margin:14px 0 10px; text-align:center; background:var(--card); font-size:18px}
  .gate p.err{color:var(--coral); min-height:20px}

  .toast{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translate(-50%,-150%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-weight:600; transition:transform .3s; z-index:60; font-size:15px; max-width:90%; text-align:center}
  .toast.show{transform:translate(-50%,0)}
  #fx{position:fixed; inset:0; pointer-events:none; z-index:50}
  .celebrate{position:fixed; inset:0; z-index:45; background:rgba(20,16,30,.72); display:flex; align-items:center; justify-content:center; padding:24px}
  .celebrate .box{position:relative; z-index:55; background:var(--card); border-radius:32px; padding:22px 20px 20px; width:100%; max-width:340px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35); animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
  .celebrate .pet{width:170px; margin:-80px auto 4px; animation:hop 1.2s ease-in-out infinite}
  .celebrate .pet svg{width:100%; height:auto; filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
  .celebrate h3{margin:4px 0 6px; font-size:22px}
  .celebrate p{margin:0 0 16px; color:var(--muted); font-size:15px}
  @keyframes popin{0%{transform:scale(.3); opacity:0}100%{transform:scale(1); opacity:1}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px) rotate(-3deg)}}
  .pop{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .syncdot{font-size:12px; color:var(--muted); text-align:center; margin-top:6px}
  /* 🐱 貓貓 skin */
  body{background-image:radial-gradient(circle at 20px 20px, rgba(255,122,107,.06) 3px, transparent 4px),radial-gradient(circle at 60px 60px, rgba(155,135,245,.06) 3px, transparent 4px); background-size:80px 80px}
  .catcard{display:flex; align-items:flex-end; gap:6px; margin:0 0 14px}
  .catcard .cat{width:118px; flex:none; cursor:pointer}
  .catcard .cat svg{width:100%; height:auto; display:block; filter:drop-shadow(0 8px 12px rgba(46,42,59,.12))}
  .catcard .cat.bounce svg{animation:bounce .6s ease}
  @keyframes bounce{30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
  .bubble{position:relative; flex:1; background:var(--card); border-radius:22px; padding:14px 16px; font-weight:600; font-size:16px; box-shadow:var(--shadow); margin-bottom:34px}
  .bubble:after{content:''; position:absolute; left:-9px; bottom:18px; border:10px solid transparent; border-right-color:var(--card); border-left:0}
  .bubble small{display:block; font-weight:500; font-size:12px; color:var(--muted); margin-top:4px}
  .locker{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .lk{background:var(--soft); border-radius:20px; padding:8px 4px 10px; text-align:center; position:relative}
  .lk svg{width:74px; height:auto}
  .lk b{display:block; font-size:13px}
  .lk small{font-size:11px; color:var(--muted)}
  .lk.locked svg{filter:grayscale(1) opacity(.35)}
  .lk.on{background:var(--lav-soft); box-shadow:0 0 0 3px var(--lav)}
  .lk .lock{position:absolute; top:6px; right:8px; font-size:14px}
  .sharebig{width:100%; border-radius:20px; display:block; margin-bottom:12px; box-shadow:var(--shadow)}

  /* Cycle journal: table scrolls within the card on small screens. */
  nav.tabs{width:calc(100% - 24px);max-width:448px}
  nav.tabs button{flex:1;padding:11px 5px;font-size:13px}
  .cycle-hero{background:var(--lav-soft);border-radius:28px;padding:18px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .cycle-hero svg{width:126px;flex:none;height:154px}
  .cycle-hero h2{font-size:22px;margin:4px 0 8px}
  .cycle-hero p{font-size:14px;margin:0;line-height:1.7}
  .cycle-kicker{font-size:11px;letter-spacing:.12em;color:var(--muted)}
  .cycle-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .cycle-toolbar input{min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:9px;color:var(--ink)}
  .cycle-toolbar button{background:var(--soft);border-radius:12px;min-height:44px;padding:8px 12px}
  .cycle-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:16px}
  .cycle-table{border-collapse:separate;border-spacing:0;min-width:820px;width:100%;font-size:13px}
  .cycle-table caption{text-align:left;padding:12px;color:var(--muted)}
  .cycle-table th,.cycle-table td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  .cycle-table th{background:var(--soft);font-weight:600;white-space:nowrap}
  .cycle-table th:first-child,.cycle-table td:first-child{position:sticky;left:0;background:var(--card);z-index:1;min-width:92px}
  .cycle-table th:first-child{background:var(--soft);z-index:2}
  .cycle-table td:nth-child(2){min-width:190px;max-width:240px;overflow-wrap:anywhere}
  .cycle-table small{display:block;color:var(--muted);line-height:1.6}
  .cycle-table button{min-height:44px;text-align:left;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
  .cycle-tag{display:inline-block;background:var(--lav-soft);padding:2px 7px;border-radius:8px;font-size:11px;margin-bottom:4px}
  .cycle-note{font-size:12px;line-height:1.8;color:var(--muted);margin:12px 0 0}
  .cycle-form select{font:inherit;color:var(--ink);background:var(--card);padding:11px;border:1px solid var(--line);border-radius:12px;width:100%}
  .cycle-form .cycle-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cycle-checks{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0 18px;font-size:14px}
  .cycle-checks label,.cycle-start{display:flex;align-items:center;gap:7px;min-height:36px}
  .cycle-checks input,.cycle-start input{width:18px;height:18px;accent-color:var(--lav)}
  .cycle-start{font-size:14px;margin:0 0 14px}
  @media(max-width:350px){.cycle-hero svg{width:100px}.cycle-hero{padding:14px;gap:8px}}


  .miu-daily{border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
  .miu-daily-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .miu-daily-cat{width:65px;flex:none;line-height:0;border-radius:18px;background:var(--lav-soft);padding:5px}
  .miu-daily-cat svg{width:100%;height:auto}
  .miu-daily h2{margin:0 0 4px;font-size:16px}
  .miu-daily-meta{font-size:12px;color:var(--muted)}
  .miu-daily blockquote{margin:0;font-size:19px;line-height:1.7;font-weight:650;letter-spacing:.01em;overflow-wrap:anywhere}
  .miu-daily-credit{font-size:12px;line-height:1.7;color:var(--muted);margin-top:10px}
  .miu-daily-credit a{color:inherit;text-underline-offset:3px;display:inline-block;padding:5px 0}
  .miu-daily-greeting{font-size:13px;margin:12px 0 0;color:var(--muted)}

  .miu-reply{font-size:14px;line-height:1.7;padding:12px;border-radius:14px;background:var(--lav-soft);margin:12px 0 0;overflow-wrap:anywhere}
  nav.tabs button{font-size:12px;padding:11px 3px}
  .tt-intro{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 12px;gap:8px}
  .tt-eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em}
  .tt-intro h2{margin:5px 0;font-size:27px;letter-spacing:-.03em}
  .tt-intro h2 span{display:block;font-size:15px;letter-spacing:.04em;margin-top:4px}
  .tt-intro p{margin:6px 0;font-size:13px;color:var(--muted)}
  .tt-mascot{width:86px;flex:none}.tt-mascot svg{width:100%;height:auto}
  .tt-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}

  .tt-progress{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:2px 3px 12px}

  fetch(SB+'/rest/v1/ming_log?id=eq.main&updated_at=eq.'+encodeURIComponent(lastTs),{method:'PATCH',headers:hdr({Prefer:'return=representation'}),body:JSON.stringify({state:state,updated_at:ts})})
  .then(function(r){if(!r.ok)throw new Error('net');return r.json();})
  .then(function(rows){
    if(rows&&rows.length){lastTs=rows[0].updated_at;pending=pending.slice(batch.length);saving=false;cacheSave();setSync('已儲低 '+nowT());if(pending.length)flush();return;}
    return fetchRow().then(function(rs){
      var fresh=defaults(rs[0].state); pending.forEach(function(f){f(fresh);});
      state=fresh; lastTs=rs[0].updated_at; saving=false; render(); flush();
    });
  })
  .catch(function(){saving=false;setSync('離線，遲啲再儲');setTimeout(flush,8000);});

function poll(){

    if(rs&&rs[0]&&rs[0].updated_at!==lastTs&&!pending.length){
      fetchRow().then(function(r2){state=defaults(r2[0].state);lastTs=r2[0].updated_at;cacheSave();render();setSync('已同步 '+nowT());});

var QPOOL=[
  {id:'greens',ic:'🥦',n:'食一餐有菜或生果',test:ateGreens},
  {id:'mood',ic:'😊',n:'心情打卡',test:function(d){return !!state.moods[d];}},
  {id:'steps',ic:'👟',n:'行夠 6,000 步',test:function(d){var u=uh(d);return !!(u&&u.steps>=6000);}},

  {id:'bed',ic:'🌙',n:'琴晚 11:30 前上床',test:earlyBed},
  {id:'wake',ic:'☀️',n:'今朝 7:30 前起身',test:earlyWake}
];
function quests(d){
  d=d||today(); var seed=0; for(var i=0;i<d.length;i++)seed=(seed*31+d.charCodeAt(i))%9973;
  var pool=QPOOL.slice(), pick=[];
  while(pick.length<2){seed=(seed*7+13)%9973;pick.push(pool.splice(seed%pool.length,1)[0]);}
  return [{id:'water',ic:'💧',n:'飲夠 '+state.settings.waterGoal+' 杯水',test:watered}].concat(pick);
}
function questCard(){
  var t=today(), q=quests(t), done=q.filter(function(x){return x.test(t);}).length;
  return '<section class="card"><h2>🎯 今日小任務 <span class="more">'+(done>=3?'🍀 全勝！':done+'/3')+'</span></h2>'+q.map(function(x){var ok=x.test(t);
    return '<div class="ch"><div class="ic">'+x.ic+'</div><div class="tx"><b style="'+(ok?'text-decoration:line-through;opacity:.6':'')+'">'+x.n+'</b></div><div class="ok">'+(ok?'✅':'')+'</div></div>';}).join('')+'</section>';
}
function checkFriends(){
  var t=today(), q=quests(t);
  if(!state.questWins[t]&&q.every(function(x){return x.test(t);})){mutate(function(s){s.questWins[t]=true;});setTimeout(function(){confetti();toast('🍀 今日小任務全勝！');},300);}
  FRIENDS.forEach(function(f){
    if(!f.test||state.friends.indexOf(f.id)>=0)return;

  });
}

function fireworks(ms){
  var c=$('fx'),g=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  var cols=['#FF7A6B','#FFB940','#9B87F5','#4FBDEB','#FF8FBF','#FFE27A','#7FE0B0'],ps=[],t0=Date.now(),next=0;
  function burst(){var x=innerWidth*(.15+Math.random()*.7),y=innerHeight*(.12+Math.random()*.35),col=cols[Math.floor(Math.random()*cols.length)],n=46;
    for(var i=0;i<n;i++){var a=Math.PI*2*i/n,sp=2.5+Math.random()*3.5;ps.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,c:Math.random()<.25?'#FFFFFF':col});}}
  (function f(){
    var el=Date.now()-t0; if(el<ms&&el>=next){burst();next=el+380+Math.random()*320;}
    g.fillStyle='rgba(0,0,0,0)'; g.clearRect(0,0,c.width,c.height);
    ps.forEach(function(p){p.vy+=.06;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.life-=.012;
      if(p.life>0){g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,2.6,0,7);g.fill();}});
    g.globalAlpha=1; ps=ps.filter(function(p){return p.life>0;});
    if(el<ms||ps.length)requestAnimationFrame(f);else g.clearRect(0,0,c.width,c.height);
  })();
}

  var url=new URL(location.href);url.searchParams.set('v',String(Date.now()));

    if(!/var APP_VER='[^']+'/.test(html)||html.indexOf('id="main"')<0)throw new Error('invalid app');
    if(!button.isConnected||!$('sheet').classList.contains('show')||blocked())return;
    status.textContent='已取得最新版本，正在重新載入…';
    location.replace(url.href);
  }).catch(function(){if(status.isConnected)status.textContent='暫時未能更新。請檢查網絡後再按一次；目前的記錄及遊戲進度會保留。';}).finally(function(){clearTimeout(timer);if(button.isConnected){button.disabled=false;button.textContent='🔄 更新 App';}});
}

      var x=x0+(i%cols)*(size+gap),y=top+Math.floor(i/cols)*(size+gap);if(ims.length===3&&i===2)x=(W-size)/2;
      g.save();roundRect(g,x,y,size,size,40);g.clip();
      var s=Math.max(size/im.width,size/im.height);g.drawImage(im,x+(size-im.width*s)/2,y+(size-im.height*s)/2,im.width*s,im.height*s);g.restore();
    });
    if(!ims.length){g.font='600 44px '+FN;g.fillStyle='#8C8599';g.fillText('今日未影食物相 📷',W/2,1400);}
    g.font='500 32px '+FN;g.fillStyle='#8C8599';g.fillText('我同喵喵嘅今日 · Ming 今日',W/2,H-70);
    return c;
  });
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* TRIPLE_TILE_BEGIN — local-only game, independent of health state. */
var TT_LEVELS={easy:{name:'輕鬆',total:36,capacity:8,types:5,layers:2},normal:{name:'標準',total:54,capacity:7,types:7,layers:3},hard:{name:'挑戰',total:72,capacity:6,types:9,layers:3},extreme:{name:'超級難',total:126,capacity:5,types:9,layers:6}};
var TT_ANIMALS=['miu','bunny','capy','shiba','penguin','koala','panda','fox','otter'];
var TT_NAMES=['喵喵','兔仔','水豚','柴犬','企鵝','樹熊','熊貓','狐狸','海獺'];
var ttGame=null,ttLoaded=false,ttHint=null,ttNotice='',ttSaved=true;
function ttShuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),v=a[i];a[i]=a[j];a[j]=v;}return a;}
function ttOverlap(a,b){return Math.abs(a.x-b.x)<.99&&Math.abs(a.y-b.y)<.99;}
function ttFree(tiles,removed,t){return !removed.has(t.id)&&!tiles.some(function(b){return b.z>t.z&&!removed.has(b.id)&&ttOverlap(t,b);});}
function ttLayout(level){
  var out=[],add=function(cols,rows,z,ox,oy){for(var y=0;y<rows;y++)for(var x=0;x<cols;x++)out.push({id:out.length,x:x+ox,y:y+oy,z:z,kind:0});};
  if(level==='easy'){add(6,4,0,0,0);add(4,3,1,.5,.5);}
  if(level==='normal'){add(6,5,0,0,0);add(6,3,1,.5,.5);add(3,2,2,1.75,1.5);}
  if(level==='hard'){add(6,6,0,0,0);add(6,4,1,.5,.5);add(4,3,2,1.25,1.25);}
  if(level==='extreme'){add(6,6,0,0,0);add(6,5,1,.5,.25);add(6,4,2,.25,.75);add(6,3,3,.5,1.25);add(6,2,4,.25,1.75);add(6,1,5,.5,2.25);}
  return out;
}

// Interleave unfinished triples while preserving a winning five-slot path.
function ttBraidedKinds(groups,types){
  var left=Array(types).fill(0),held=Array(types).fill(0),load=0,out=[];
  groups.forEach(function(k){left[k]+=3;});
  while(out.length<groups.length*3){
    var eligible=[];
    for(var k=0;k<types;k++){
      if(!left[k])continue;
      var next=load+(held[k]===2?-2:1),copy=held.slice();copy[k]=(copy[k]+1)%3;
      if(next<5&&(next<4||copy.indexOf(2)>=0))eligible.push(k);
    }
    var preferred=eligible.filter(function(k){return load<3?held[k]===0:load===3?held[k]===1:held[k]===2;});
    var pool=preferred.length?preferred:eligible,k=pool[Math.floor(Math.random()*pool.length)];
    if(k==null)throw new Error('No valid five-slot sequence');
    left[k]--;load+=held[k]===2?-2:1;held[k]=(held[k]+1)%3;out.push(k);
  }
  return out;
}
function ttToolsLeft(kind){if(!ttGame||ttGame.level!=='extreme')return Infinity;return Math.max(0,(kind==='undo'?3:2)-(ttGame[kind+'Used']||0));}

function ttNew(level){
  var cfg=TT_LEVELS[level],tiles=ttLayout(level),removed=new Set(),solution=[];
  // A legal removal order is chosen first; extreme interleaves several unfinished triples.
  // This supplies a complete winning path without relying on a lucky random deal.
  while(solution.length<tiles.length){var free=tiles.filter(function(t){return ttFree(tiles,removed,t);}),t=free[Math.floor(Math.random()*free.length)];solution.push(t.id);removed.add(t.id);}
  var groups=[];for(var g=0;g<tiles.length/3;g++)groups.push(g%cfg.types);ttShuffle(groups);
  var kinds=level==='extreme'?ttBraidedKinds(groups,cfg.types):null;
  solution.forEach(function(id,i){tiles[id].kind=kinds?kinds[i]:groups[Math.floor(i/3)];});
  return {version:1,level:level,tiles:tiles,picks:[],solution:solution};
}
function ttState(game){
  var tray=[],removed=new Set();
  game.picks.forEach(function(id){var t=game.tiles[id];removed.add(id);tray.push(id);if(tray.filter(function(i){return game.tiles[i].kind===t.kind;}).length===3)tray=tray.filter(function(i){return game.tiles[i].kind!==t.kind;});});
  return {tray:tray,removed:removed,won:removed.size===game.tiles.length&&tray.length===0,lost:tray.length>=TT_LEVELS[game.level].capacity,matched:(removed.size-tray.length)/3};
}
function ttValid(g){
  if(!g||g.version!==1||!Object.prototype.hasOwnProperty.call(TT_LEVELS,g.level)||!Array.isArray(g.tiles)||!Array.isArray(g.picks))return false;
  if(g.level==='extreme'&&['undo','hint'].some(function(k){var n=g[k+'Used']==null?0:g[k+'Used'];return !Number.isInteger(n)||n<0||n>(k==='undo'?3:2);}))return false;
  var layout=ttLayout(g.level),cfg=TT_LEVELS[g.level];
  if(g.tiles.length!==cfg.total||g.picks.length>cfg.total)return false;
  if(g.tiles.some(function(t,i){var l=layout[i];return !t||t.id!==i||t.x!==l.x||t.y!==l.y||t.z!==l.z||!Number.isInteger(t.kind)||t.kind<0||t.kind>=cfg.types;}))return false;
  for(var k=0;k<cfg.types;k++)if(g.tiles.filter(function(t){return t.kind===k;}).length%3)return false;
  var replay={level:g.level,tiles:g.tiles,picks:[]};
  for(var n=0;n<g.picks.length;n++){var id=g.picks[n],st=ttState(replay);if(!Number.isInteger(id)||!g.tiles[id]||st.won||st.lost||!ttFree(g.tiles,st.removed,g.tiles[id]))return false;replay.picks.push(id);}
  return true;
}
function ttKey(){return 'mingTripleTileV1'+(DEMO?'Demo':'');}
function ttLoad(){
  if(ttLoaded)return;ttLoaded=true;
  try{var g=JSON.parse(localStorage.getItem(ttKey())||'null');if(ttValid(g))ttGame=g;}catch(e){}
}
function ttSave(){try{localStorage.setItem(ttKey(),JSON.stringify(ttGame));ttSaved=true;}catch(e){ttSaved=false;}}
function ttArt(kind){return kind===0?catSVG('home','none','happy'):animalSVG(TT_ANIMALS[kind],'none','happy');}
function ttBegin(level){if(!Object.prototype.hasOwnProperty.call(TT_LEVELS,level))return;ttGame=ttNew(level);ttHint=null;ttNotice='喵喵：慢慢找，三位相同的朋友就能回家。';ttSave();closeSheet();render();}
function ttChoose(level){
  if(!Object.prototype.hasOwnProperty.call(TT_LEVELS,level))return;
  if(ttGame&&ttGame.picks.length&&!ttState(ttGame).won){openSheet(head('開新一局？')+'<p>目前這局會換成新的'+TT_LEVELS[level].name+'關卡。</p><div class="btnrow"><button class="btn" data-act="close">繼續這局</button><button class="btn fun" data-act="ttBegin" data-level="'+level+'">開新一局</button></div>');}
  else ttBegin(level);
}
function ttPick(id){
  if(!ttGame||!Number.isInteger(id))return;var before=ttState(ttGame),tile=ttGame.tiles[id];
  if(!tile||before.won||before.lost||!ttFree(ttGame.tiles,before.removed,tile))return;
  ttGame.picks.push(id);ttHint=null;var after=ttState(ttGame);
  ttNotice=after.won?'喵喵：全員回家！你的觀察力閃閃發光。😽':after.lost?'喵喵：收集槽滿了，撤回一步再想想，我陪你。':after.matched>before.matched?['三位朋友一起回家了，做得好！🐾','配成一組！喵喵幫你拍拍手。😸','找到同伴了，繼續慢慢來。🌷'][after.matched%3]:'已接住'+TT_NAMES[tile.kind]+'，再找牠的同伴。';
  ttSave();render();if(after.won)confetti();
}
function ttUndo(){if(!ttGame||!ttGame.picks.length||!ttToolsLeft('undo'))return;if(ttGame.level==='extreme')ttGame.undoUsed=(ttGame.undoUsed||0)+1;ttGame.picks.pop();ttHint=null;ttNotice='退一步也沒關係，這次換個想法。🐾';ttSave();render();}
function ttGiveHint(){
  if(!ttGame||!ttToolsLeft('hint'))return;var st=ttState(ttGame);if(st.won||st.lost)return;
  var free=ttGame.tiles.filter(function(t){return ttFree(ttGame.tiles,st.removed,t);});
  free.sort(function(a,b){function score(t){return st.tray.filter(function(id){return ttGame.tiles[id].kind===t.kind;}).length*10+free.filter(function(x){return x.kind===t.kind;}).length;}return score(b)-score(a);});
  if(free.length){if(ttGame.level==='extreme'){ttGame.hintUsed=(ttGame.hintUsed||0)+1;ttSave();}ttHint=free[0].id;ttNotice='看看亮起的'+TT_NAMES[free[0].kind]+'，留意牠還有多少同伴。';render();}
}

  h+='</div><p class="tt-message" role="status" aria-live="polite">'+esc(ttNotice||(st.won?'全員回家！再來一局嗎？':st.lost?'收集槽滿了，可以撤回再試。':'點亮起的牌，三隻相同就能消除。'))+'</p>';

function acAdjacent(a,b){return Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<36&&b>=0&&b<36&&(Math.floor(a/6)===Math.floor(b/6)&&Math.abs(a-b)===1||Math.abs(a-b)===6);}
function acMatches(board){var found=new Set();for(var axis=0;axis<2;axis++)for(var line=0;line<6;line++){var run=[];for(var p=0;p<=6;p++){var id=axis?p*6+line:line*6+p;if(p<6&&board[id]!=null&&(!run.length||board[id]===board[run[0]]))run.push(id);else{if(run.length>=3)run.forEach(function(i){found.add(i);});run=p<6&&board[id]!=null?[id]:[];}}}return Array.from(found);}
function acFindMove(board){for(var a=0;a<36;a++)for(var d of [1,6]){var b=a+d;if(!acAdjacent(a,b))continue;var copy=board.slice(),v=copy[a];copy[a]=copy[b];copy[b]=v;if(acMatches(copy).length)return [a,b];}return [];}
function acFresh(types){for(var tries=0;tries<500;tries++){var b=[];for(var i=0;i<36;i++){var opts=[];for(var k=0;k<types;k++)if(!(i%6>=2&&b[i-1]===k&&b[i-2]===k)&&!(i>=12&&b[i-6]===k&&b[i-12]===k))opts.push(k);b.push(opts[Math.floor(Math.random()*opts.length)]);}if(acFindMove(b).length)return b;}var b=Array.from({length:36},function(_,i){return(i+Math.floor(i/6))%types;});b[0]=0;b[1]=1;b[2]=0;b[7]=0;return b;}
function acDrop(board,matched,types){var gone=new Set(matched),out=board.slice();for(var col=0;col<6;col++){var keep=[];for(var row=5;row>=0;row--){var id=row*6+col;if(!gone.has(id))keep.push(board[id]);}for(var row=5;row>=0;row--)out[row*6+col]=keep.length?keep.shift():Math.floor(Math.random()*types);}return out;}
function acStatus(g){return g.score>=AC_LEVELS[g.level].target?'won':g.moves===0?'lost':'playing';}
function acKey(){return 'mingAnimalCrushV1'+(DEMO?'Demo':'');}
function acValid(g){return !!g&&g.version===1&&Object.prototype.hasOwnProperty.call(AC_LEVELS,g.level)&&Array.isArray(g.board)&&g.board.length===36&&g.board.every(function(k){return Number.isInteger(k)&&k>=0&&k<AC_LEVELS[g.level].types;})&&Number.isInteger(g.moves)&&g.moves>=0&&g.moves<=AC_LEVELS[g.level].moves&&Number.isInteger(g.score)&&g.score>=0&&g.score<=10000000&&!acMatches(g.board).length;}
function acLoad(){if(acLoaded)return;acLoaded=true;try{var g=JSON.parse(localStorage.getItem(acKey())||'null');if(acValid(g)){acGame=g;if(acStatus(g)==='playing'&&!acFindMove(g.board).length)g.board=acFresh(AC_LEVELS[g.level].types);}}catch(e){}}
function acSave(){try{localStorage.setItem(acKey(),JSON.stringify(acGame));acSaved=true;}catch(e){acSaved=false;}}
function acRender(){if(tab==='game'&&gameChoice==='crush')render();}
function acBegin(level){if(acBusy||!Object.prototype.hasOwnProperty.call(AC_LEVELS,level))return;var c=AC_LEVELS[level];acGame={version:1,level:level,board:acFresh(c.types),moves:c.moves,score:0};acSelected=null;acHint=[];acClearing=[];acNotice='先點一隻，再點旁邊的朋友交換位置。';acSave();closeSheet();acRender();}
function acChoose(level){if(acBusy||!Object.prototype.hasOwnProperty.call(AC_LEVELS,level))return;if(acGame&&acStatus(acGame)==='playing'&&acGame.moves<AC_LEVELS[acGame.level].moves)openSheet(head('開新一局？')+'<p>目前的動物消消樂進度會換成新一局。</p><div class="btnrow"><button class="btn" data-act="close">繼續這局</button><button class="btn fun" data-act="acBegin" data-level="'+level+'">開新一局</button></div>');else acBegin(level);}
function acDelay(){return new Promise(function(resolve){setTimeout(resolve,window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:180);});}
async function acSwap(a,b){
 if(acBusy||!acGame||acStatus(acGame)!=='playing'||!acAdjacent(a,b))return;
 var board=acGame.board.slice(),v=board[a];board[a]=board[b];board[b]=v;acSelected=null;acHint=[];
 if(!acMatches(board).length){acNotice='這次未連成三隻，步數不扣，換個方向試試。🐾';acRender();return;}
 acBusy=true;acGame.board=board;acGame.moves--;var combo=0,total=0;
 try{
  while(acMatches(acGame.board).length&&combo<50){var hit=acMatches(acGame.board);combo++;total+=hit.length*10*Math.min(combo,3);acGame.score+=hit.length*10*Math.min(combo,3);acClearing=hit;acNotice=combo>1?'連鎖 '+combo+'！動物朋友接力回家。✨':'找到 '+hit.length+' 位同伴！😸';acRender();await acDelay();acGame.board=acDrop(acGame.board,hit,AC_LEVELS[acGame.level].types);acClearing=[];acRender();await acDelay();}
  if(acMatches(acGame.board).length||!acFindMove(acGame.board).length){acGame.board=acFresh(AC_LEVELS[acGame.level].types);acNotice='動物朋友換了新位置，不扣步數，繼續找同伴！';}else acNotice='這一步 +'+total+' 分'+(combo>1?'，'+combo+' 連鎖！':'！')+' 喵喵替你拍拍手。';
  var status=acStatus(acGame);if(status==='won')acNotice='目標達成！你的觀察力今天閃閃發光。😽';else if(status==='lost')acNotice='這次先到這裏，再開一局試試吧，我陪你。';
  acSave();if(status==='won'&&tab==='game'&&gameChoice==='crush')confetti();
 }finally{acBusy=false;acClearing=[];acRender();}
}
function acTap(id){if(acBusy||!acGame||acStatus(acGame)!=='playing'||!Number.isInteger(id)||id<0||id>=36)return;if(acSelected===id){acSelected=null;acRender();return;}if(acSelected!=null&&acAdjacent(acSelected,id)){acSwap(acSelected,id);return;}acSelected=id;acHint=[];acNotice='再點上、下、左或右相鄰的動物。';acRender();}
function acHelp(){if(acBusy||!acGame||acStatus(acGame)!=='playing')return;acHint=acFindMove(acGame.board);if(!acHint.length){acGame.board=acFresh(AC_LEVELS[acGame.level].types);acSave();acHint=acFindMove(acGame.board);}acSelected=null;acNotice='交換金色框住的兩位朋友，就能連成一組。';acRender();}

    state=defaults(rs[0].state);lastTs=rs[0].updated_at;dataReady=true;cacheSave();showApp();render();setSync('已同步 '+nowT());
    loadPhotos(shift(today(),-30),today());loadDuo();
  }).catch(function(){if(state){setSync('離線，用緊上次嘅資料');}else showGate('連唔到網絡，遲啲再試');});
}
setInterval(poll,5000);
setInterval(refreshMiuDaily,30000);
setInterval(function(){if(chatOpen)loadChat();},3000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){poll();checkVer();refreshMiuDaily();}});
function checkVer(){if(DEMO)return;fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var m=t.match(/APP_VER='([^']+)'/);if(m&&m[1]!==APP_VER)toast('🔄 有新版本，到「設定 → 更新 App」即可更新');}).catch(function(){});}
boot();
})();
</script>
