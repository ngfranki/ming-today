<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Ming 今日</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ming 今日">
<meta name="theme-color" content="#FFF6EE">
<style>
  :root{
    --bg:#FFF6EE; --card:#FFFFFF; --ink:#2E2A3B; --muted:#8C8599; --line:#F1E6DC; --soft:#FBEFE5;
    --coral:#FF7A6B; --sun:#FFB940; --lav:#9B87F5; --sky:#4FBDEB; --pink:#FF8FBF;
    --coral-soft:#FFE4E0; --sun-soft:#FFF0D2; --lav-soft:#ECE7FF; --sky-soft:#DDF3FC;
    --shadow:0 2px 6px rgba(46,42,59,.05), 0 12px 30px rgba(46,42,59,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1823; --card:#26222F; --ink:#F4EFFA; --muted:#A79FB5; --line:#352F40; --soft:#2E2938;
      --coral-soft:#4A2B2A; --sun-soft:#46381F; --lav-soft:#332C4F; --sky-soft:#1F3A47;
      --shadow:0 2px 6px rgba(0,0,0,.3), 0 12px 30px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink)}
  body{font-family:-apple-system,"PingFang HK",sans-serif; font-size:16px; line-height:1.45; padding-bottom:env(safe-area-inset-bottom); overflow-x:hidden}
  button,input,textarea{font:inherit; color:inherit}
  button{cursor:pointer; border:0; background:none; padding:0}
  .app{max-width:480px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px 120px}
  .hide{display:none!important}

  header.top{display:flex; align-items:center; gap:10px; margin:4px 0 14px}
  header.top h1{font-size:24px; margin:0; flex:1; letter-spacing:-.02em}
  header.top h1 small{display:block; font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0}
  .streak{background:var(--sun-soft); color:#A0620A; border-radius:999px; padding:6px 12px; font-weight:700; font-size:15px; white-space:nowrap}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .streak{color:var(--sun)} }
  .iconbtn{width:40px; height:40px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); font-size:18px}

  .card{background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
  .card h2{font-size:17px; margin:0 0 12px; display:flex; align-items:center; gap:8px}
  .ringcard{position:relative; padding-top:40px}
  .morebtn{position:absolute; top:12px; right:14px; font-size:13px; font-weight:700; color:var(--muted); background:var(--soft); border-radius:999px; padding:5px 12px}
  .card h2 .more{margin-left:auto; font-size:13px; color:var(--muted); font-weight:500}

  /* three big rings */
  .rings{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center}
  .ring{position:relative}
  .ring svg{width:100%; max-width:118px; height:auto; display:block; margin:0 auto}
  .ring .emo{position:absolute; left:0; right:0; top:0; height:0; padding-top:min(100%,118px); display:flex; align-items:center; justify-content:center}
  .ring .emo span{position:absolute; top:50%; transform:translateY(-50%); font-size:34px}
  .ring b{display:block; font-size:14px; margin-top:4px}
  .ring i{display:block; font-style:normal; font-size:12px; color:var(--muted)}
  .verdict{margin-top:14px; background:var(--soft); border-radius:18px; padding:12px 14px; font-size:16px; font-weight:600}
  .demo{font-size:12px; color:var(--muted); margin-top:8px; text-align:center}

  /* camera button */
  .snap{display:flex; align-items:center; gap:14px; width:100%; border-radius:26px; padding:18px 20px; margin-bottom:14px;
    background:linear-gradient(120deg,var(--coral),var(--pink)); color:#fff; box-shadow:0 10px 26px rgba(255,122,107,.35); text-align:left}
  .snap .cam{font-size:40px}
  .snap b{font-size:20px; display:block}
  .snap span{font-size:13px; opacity:.9}
  .snap:active{transform:scale(.98)}
  .snaprow{display:flex; gap:10px; margin:-4px 0 14px}
  .snaprow button{flex:1; background:var(--card); box-shadow:var(--shadow); border-radius:18px; padding:10px; font-size:14px; font-weight:600}

  /* mood */
  .moods{display:flex; justify-content:space-between}
  .moods button{font-size:34px; width:58px; height:58px; border-radius:20px; background:var(--soft); transition:transform .15s}
  .moods button.on{background:var(--sun-soft); transform:scale(1.12); box-shadow:0 0 0 3px var(--sun)}
  .moodnote{font-size:13px; color:var(--muted); margin-top:10px; text-align:center}

  /* water */
  .water{display:grid; grid-template-columns:repeat(8,1fr); gap:5px}
  .water button{font-size:22px; height:44px; border-radius:14px; background:var(--soft); filter:grayscale(1); opacity:.45}
  .water button.on{filter:none; opacity:1; background:var(--sky-soft)}

  /* photo grid */
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; border-radius:16px; overflow:hidden}
  .grid .ph{aspect-ratio:1; background:var(--soft) center/cover no-repeat; position:relative; display:flex; align-items:center; justify-content:center; font-size:30px}
  .grid .ph .tag{position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.45); color:#fff; font-size:11px; border-radius:8px; padding:1px 6px}
  .grid .ph .heart{position:absolute; right:6px; top:4px; font-size:16px}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:14px 0}
  .kcalline{font-size:14px; color:var(--muted); margin-top:10px}
  .kcalline b{color:var(--ink)}

  /* challenges */
  .ch{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line)}
  .ch:first-of-type{border-top:0}
  .ch .ic{font-size:30px; width:44px; text-align:center}
  .ch .tx{flex:1}
  .ch .tx b{display:block; font-size:15px}
  .dots{display:flex; gap:4px; margin-top:5px}
  .dots i{width:14px; height:14px; border-radius:50%; background:var(--line)}
  .dots i.on{background:var(--lav)}
  .ch .ok{font-size:22px}
  .badges{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; text-align:center}
  .badge{background:var(--lav-soft); border-radius:20px; padding:10px 4px}
  .badge span{font-size:34px; display:block}
  .badge small{font-size:11px; color:var(--muted)}

  /* highlight */
  .hl{display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
  .hl:first-of-type{border-top:0}
  .hl .big{font-size:30px; width:54px; height:54px; border-radius:16px; background:var(--soft) center/cover; display:flex; align-items:center; justify-content:center; flex:none}
  .hl b{display:block}
  .hl span{font-size:13px; color:var(--muted)}

  /* mood x sleep picture */
  .plot{position:relative; height:180px; border-radius:18px; background:linear-gradient(90deg,var(--lav-soft),var(--sky-soft)); margin-top:4px}
  .plot .e{position:absolute; font-size:22px; transform:translate(-50%,50%)}
  .plot .ax{position:absolute; bottom:4px; font-size:11px; color:var(--muted)}

  .btnrow{display:flex; gap:10px}
  .btn{flex:1; border-radius:18px; padding:13px; font-weight:700; background:var(--soft)}
  .btn.primary{background:var(--ink); color:var(--bg)}
  .btn.fun{background:linear-gradient(120deg,var(--lav),var(--sky)); color:#fff}
  .btn:disabled{opacity:.5}

  /* bottom nav */
  nav.tabs{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; gap:4px; background:var(--card); box-shadow:var(--shadow); border-radius:999px; padding:5px; z-index:20}
  nav.tabs button{padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap}
  nav.tabs button.on{background:var(--ink); color:var(--bg)}
  .fab{position:fixed; right:max(16px, calc(50% - 224px)); bottom:calc(76px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; background:var(--lav); color:#fff; font-size:26px; box-shadow:0 10px 24px rgba(155,135,245,.45); z-index:21}

  /* sheet */
  .veil{position:fixed; inset:0; background:rgba(20,16,30,.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:30}
  .veil.show{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:50%; bottom:0; width:100%; max-width:480px; transform:translate(-50%,105%); transition:transform .25s ease; background:var(--bg); border-radius:28px 28px 0 0; padding:18px 16px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; z-index:31}
  .sheet.show{transform:translate(-50%,0)}
  .sheet h3{margin:0 0 12px; font-size:19px; display:flex; align-items:center}
  .sheet h3 .x{margin-left:auto; width:34px; height:34px; border-radius:50%; background:var(--soft); font-size:16px}
  .row{display:flex; align-items:center; gap:10px; background:var(--card); border-radius:18px; padding:10px 12px; margin-bottom:8px}
  .row .nm{flex:1; min-width:0}
  .row .nm b{display:block; font-size:15px}
  .row .nm small{color:var(--muted); font-size:12px}
  .step{display:flex; align-items:center; gap:4px}
  .step button{width:30px; height:30px; border-radius:50%; background:var(--soft); font-weight:700}
  .step input{width:56px; text-align:center; border:1px solid var(--line); border-radius:10px; padding:4px; background:var(--card)}
  .del{color:var(--muted); font-size:18px; width:28px}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
  .chips button{padding:7px 14px; border-radius:999px; background:var(--card); font-size:14px; font-weight:600; box-shadow:var(--shadow)}
  .chips button.on{background:var(--ink); color:var(--bg)}
  .preview{width:100%; max-height:220px; object-fit:cover; border-radius:20px; margin-bottom:12px}
  .field{display:block; margin-bottom:12px}
  .field span{display:block; font-size:13px; color:var(--muted); margin-bottom:4px}
  .field input,.field textarea{width:100%; border:1px solid var(--line); border-radius:14px; padding:10px 12px; background:var(--card)}
  .spinner{text-align:center; padding:30px 0; font-size:15px}
  .spinner .bob{font-size:44px; display:inline-block; animation:bob 1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-10px) rotate(-8deg)}}
  .detail table{width:100%; border-collapse:collapse; font-size:14px}
  .detail td{padding:7px 4px; border-bottom:1px solid var(--line)}
  .detail td:last-child{text-align:right; font-variant-numeric:tabular-nums}
  .detail h4{margin:16px 0 6px; font-size:14px; color:var(--muted)}
  .src{font-size:11px; color:var(--muted); overflow-wrap:anywhere}
  .sheet input,.sheet textarea{min-width:0; max-width:100%}
  .bodyrow{display:flex; gap:8px; margin-top:12px}
  .bodyrow input{flex:1 1 0; width:0; min-width:0; border:1px solid var(--line); border-radius:14px; padding:10px; background:var(--card)}
  .bodyrow button{flex:none; padding:10px 16px}

  /* chat */
  .msgs{display:flex; flex-direction:column; gap:8px; min-height:180px; max-height:52vh; overflow-y:auto; padding:4px 0 10px}
  .msg{max-width:84%; padding:10px 13px; border-radius:18px; font-size:15px; white-space:pre-wrap; word-break:break-word}
  .msg.me{align-self:flex-end; background:var(--lav); color:#fff; border-bottom-right-radius:6px}
  .msg.eva{align-self:flex-start; background:var(--card); border-bottom-left-radius:6px}
  .msg.wait{opacity:.7}
  .msg img{max-width:160px; border-radius:12px; display:block; margin-bottom:6px}
  .compose{display:flex; gap:8px; align-items:flex-end}
  .compose textarea{flex:1; border:1px solid var(--line); border-radius:18px; padding:10px 12px; background:var(--card); resize:none; height:44px}
  .compose button{width:44px; height:44px; border-radius:50%; background:var(--soft); font-size:18px; flex:none}
  .compose button.send{background:var(--ink); color:var(--bg)}

  /* gate */
  .gate{max-width:360px; margin:18vh auto 0; text-align:center; padding:0 16px}
  .gate .logo{font-size:64px}
  .gate input{width:100%; border:1px solid var(--line); border-radius:16px; padding:14px; margin:14px 0 10px; text-align:center; background:var(--card); font-size:18px}
  .gate p.err{color:var(--coral); min-height:20px}

  .toast{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translate(-50%,-150%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-weight:600; transition:transform .3s; z-index:60; font-size:15px; max-width:90%; text-align:center}
  .toast.show{transform:translate(-50%,0)}
  #fx{position:fixed; inset:0; pointer-events:none; z-index:50}
  .pop{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .syncdot{font-size:12px; color:var(--muted); text-align:center; margin-top:6px}
  /* 🐱 貓貓 skin */
  body{background-image:radial-gradient(circle at 20px 20px, rgba(255,122,107,.06) 3px, transparent 4px),radial-gradient(circle at 60px 60px, rgba(155,135,245,.06) 3px, transparent 4px); background-size:80px 80px}
  .catcard{display:flex; align-items:flex-end; gap:6px; margin:0 0 14px}
  .catcard .cat{width:118px; flex:none; cursor:pointer}
  .catcard .cat svg{width:100%; height:auto; display:block; filter:drop-shadow(0 8px 12px rgba(46,42,59,.12))}
  .catcard .cat.bounce svg{animation:bounce .6s ease}
  @keyframes bounce{30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
  .bubble{position:relative; flex:1; background:var(--card); border-radius:22px; padding:14px 16px; font-weight:600; font-size:16px; box-shadow:var(--shadow); margin-bottom:34px}
  .bubble:after{content:''; position:absolute; left:-9px; bottom:18px; border:10px solid transparent; border-right-color:var(--card); border-left:0}
  .bubble small{display:block; font-weight:500; font-size:12px; color:var(--muted); margin-top:4px}
  .locker{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .lk{background:var(--soft); border-radius:20px; padding:8px 4px 10px; text-align:center; position:relative}
  .lk svg{width:74px; height:auto}
  .lk b{display:block; font-size:13px}
  .lk small{font-size:11px; color:var(--muted)}
  .lk.locked svg{filter:grayscale(1) opacity(.35)}
  .lk.on{background:var(--lav-soft); box-shadow:0 0 0 3px var(--lav)}
  .lk .lock{position:absolute; top:6px; right:8px; font-size:14px}
  .sharebig{width:100%; border-radius:20px; display:block; margin-bottom:12px; box-shadow:var(--shadow)}
</style>
</head>
<body>
<div id="gate" class="gate hide">
  <div class="logo">☀️</div>
  <h2>Ming 今日</h2>
  <p>入你自己揀嘅暗號就開到。</p>
  <input id="gateKey" type="password" autocomplete="current-password" placeholder="暗號">
  <p class="err" id="gateErr"></p>
  <button class="btn primary" style="width:100%" id="gateGo">開門</button>
</div>

<div class="app hide" id="app">
  <header class="top">
    <h1 id="hello">早晨 ☀️<small id="todayLbl"></small></h1>
    <div class="streak" id="streak">🔥 0</div>
    <button class="iconbtn" data-act="settings" aria-label="設定">⚙️</button>
  </header>
  <main id="main"></main>
  <div class="syncdot" id="sync"></div>
</div>

<nav class="tabs hide" id="tabs">
  <button data-tab="today" class="on">☀️ 今日</button>
  <button data-tab="wall">📸 相牆</button>
  <button data-tab="fun">🏆 挑戰</button>
</nav>
<button class="fab hide" id="fab" aria-label="問 Eva">💬</button>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>
<input type="file" id="camIn" accept="image/*" capture="environment" class="hide">
<input type="file" id="libIn" accept="image/*" class="hide">

function today(){return fmt(new Date());}
function shift(s,n){var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return fmt(d);}
function dow(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).getDay();}
function wk(s){return '日一二三四五六'[dow(s)];}
function nice(s){return (+s.slice(5,7))+'月'+(+s.slice(8))+'日（'+wk(s)+'）';}
function monday(s){return shift(s,-((dow(s)+6)%7));}
function nowT(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function slotNow(){var h=new Date().getHours();return h<11?'早':h<15?'午':h<18?'下午':h<22?'晚':'宵';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function r1(x){return Math.round(x*10)/10;}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show');},2200);}
function hdr(x){return Object.assign({apikey:SBK,Authorization:'Bearer '+SBK,'x-client-info':KEY,'Content-Type':'application/json'},x||{});}
function F(){var m={};state.foods.forEach(function(f){m[f.id]=f;});return m;}

/* ---------- state ---------- */
function defaults(s){
  s=s&&typeof s==='object'?s:{};
  ['meals'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=[];});
  ['moods','water','weights','bf'].forEach(function(k){if(!s[k]||typeof s[k]!=='object')s[k]={};});
  if(!s.uh||typeof s.uh!=='object')s.uh={days:{}};
  if(!s.uh.days)s.uh.days={};
  if(!Array.isArray(s.badges))s.badges=[];
  if(!s.settings)s.settings={};
  var st=s.settings;
  if(st.waterGoal==null)st.waterGoal=8;
  if(st.sleepGoalH==null)st.sleepGoalH=7;
  if(!st.duo)st.duo={sleep:false};
  var custom=(Array.isArray(s.foods)?s.foods:[]).filter(function(f){return f.custom;});
  s.foods=BUILTIN.map(function(f){return JSON.parse(JSON.stringify(f));}).concat(custom);
  return s;
}
function cacheSave(){try{localStorage.setItem('mingCache',JSON.stringify({state:state,ts:lastTs}));}catch(e){}}
function setSync(t){$('sync').textContent=t;}

function fetchRow(){
  return fetch(SB+'/rest/v1/ming_log?id=eq.main&select=state,updated_at',{headers:hdr()})
    .then(function(r){if(!r.ok)throw new Error('net');return r.json();});
}
// 🔴 樂觀鎖：每個改動係一個 function；寫入用 PATCH ...&updated_at=eq.<上次>，0 row＝有人（同步 script／Eva）改過 → 重讀、重套未寫入嘅改動、再寫。
function mutate(fn){
  fn(state); pending.push(fn); cacheSave(); render(); flush();
}
function flush(){
  if(DEMO){pending=[];setSync('示範模式·唔會儲');return;}
  if(saving||!pending.length)return;
  saving=true; setSync('儲緊…');
  var batch=pending.slice(), ts=new Date().toISOString();
  fetch(SB+'/rest/v1/ming_log?id=eq.main&updated_at=eq.'+encodeURIComponent(lastTs),{method:'PATCH',headers:hdr({Prefer:'return=representation'}),body:JSON.stringify({state:state,updated_at:ts})})
  .then(function(r){if(!r.ok)throw new Error('net');return r.json();})
  .then(function(rows){
    if(rows&&rows.length){lastTs=rows[0].updated_at;pending=pending.slice(batch.length);saving=false;cacheSave();setSync('已儲低 '+nowT());if(pending.length)flush();return;}
    return fetchRow().then(function(rs){
      var fresh=defaults(rs[0].state); pending.forEach(function(f){f(fresh);});
      state=fresh; lastTs=rs[0].updated_at; saving=false; render(); flush();
    });
  })
  .catch(function(){saving=false;setSync('離線，遲啲再儲');setTimeout(flush,8000);});
}
function poll(){
  if(DEMO||!KEY||saving||pending.length)return;
  fetch(SB+'/rest/v1/ming_log?id=eq.main&select=updated_at',{headers:hdr()}).then(function(r){return r.json();}).then(function(rs){
    if(rs&&rs[0]&&rs[0].updated_at!==lastTs&&!pending.length){
      fetchRow().then(function(r2){state=defaults(r2[0].state);lastTs=r2[0].updated_at;cacheSave();render();setSync('已同步 '+nowT());});
    }
  }).catch(function(){});
}

function shrink(file,max,q){
  return new Promise(function(res,rej){
    var fr=new FileReader(); fr.onload=function(){var im=new Image(); im.onload=function(){
      var s=Math.min(1,max/Math.max(im.width,im.height)); var c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q));
    }; im.onerror=rej; im.src=fr.result;}; fr.onerror=rej; fr.readAsDataURL(file);
  });
}

/* ---------- derived numbers ---------- */
function mealsOn(d){return state.meals.filter(function(m){return m.date===d;});}
function totals(d){var t={kcal:0,protein:0,carb:0,fat:0,fiber:0},unknown=0;mealsOn(d).forEach(function(m){m.items.forEach(function(i){if(i.kcal==null){unknown++;return;}K.forEach(function(k){t[k]+=i[k]||0;});});});K.forEach(function(k){t[k]=Math.round(t[k]);});t.unknown=unknown;return t;}
function uh(d){return state.uh.days[d]||null;}
function sleepH(d){var u=uh(d);return u&&u.totalSleepMin?u.totalSleepMin/60:null;}
function hasRecord(d){return mealsOn(d).length>0||!!state.moods[d];}
function streak(){var d=today(),n=0;if(!hasRecord(d))d=shift(d,-1);while(hasRecord(d)){n++;d=shift(d,-1);}return n;}
function runUntil(test){var d=today(),n=0;if(!test(d))d=shift(d,-1);while(test(d)&&n<60){n++;d=shift(d,-1);}return {n:n,start:shift(d,1)};}
function weekDays(){var m=monday(today()),a=[];for(var i=0;i<7;i++)a.push(shift(m,i));return a;}

function ringSVG(v,color,soft){
  var r=46,c=2*Math.PI*r,p=v==null?0:Math.max(0,Math.min(100,v))/100;
  return '<svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="'+r+'" fill="none" stroke="'+soft+'" stroke-width="12"/>'+

function overall(u){
  if(!u)return '戒指未同步到今日數據，遲啲再睇 💍';
  var s=u.sleepScore,r=u.recovery;
  if(r>=80&&s>=80)return '今日係滿格日！想做乜就去做 ✨';
  if(r!=null&&r<50)return '今日畀自己慢少少，唔好逼自己 ☕';
  if(s!=null&&s<60)return '琴晚瞓得少，今晚早啲上床就追得返 🌙';
  return '穩穩陣陣嘅一日，繼續保持 😊';

    h+='<button class="ph" data-act="meal" data-id="'+m.id+'" style="'+(ph?'background-image:url('+ph+')':'')+'">'+(ph?'':em)+'<span class="tag">'+m.slot+' '+m.time+'</span>'+(m.heart?'<span class="heart">❤️</span>':'')+'</button>';
  });

function viewWall(){
  var h='', d=today(), shown=0;

  return h;
}

  h+='<h4>身體</h4><table>'+row('靜息心率',u.rhr!=null?u.rhr+' bpm':null)+row('HRV',u.hrv!=null?u.hrv+' ms':null)+row('血氧',u.spo2!=null?u.spo2+'%':null)+row('皮膚溫度',u.skinTemp!=null?u.skinTemp+' °C':null)+row('步數',u.steps)+row('活動分鐘',u.activeMin)+'</table>';
  var wk=Object.keys(state.weights).sort().pop(), bk=Object.keys(state.bf).sort().pop();
  h+='<h4>體重・體脂（想記先記）</h4><table>'+row('最近體重',wk?state.weights[wk]+' kg（'+wk.slice(5)+'）':null)+row('目標體重',s.goalKg?s.goalKg+' kg':null)+row('最近體脂',bk?state.bf[bk]+'%（'+bk.slice(5)+'）':null)+row('目標體脂',s.goalBf?s.goalBf+'%':null)+'</table>';
  h+='<div class="bodyrow"><input id="inW" type="number" step="0.1" inputmode="decimal" placeholder="體重 kg"><input id="inB" type="number" step="0.1" inputmode="decimal" placeholder="體脂 %"><button class="btn primary" data-act="saveBody">記</button></div>';
  h+='<p class="src">食物數字出處：'+esc(Array.from(new Set(mealsOn(t).reduce(function(a,m){return a.concat(m.items.map(function(i){return (i.src||'').split('：')[0];}));},[]).filter(Boolean))).join('；')||'–')+'</p>';
  openSheet(h+'</div>');
}
function openSettings(){

    '<button class="btn" style="width:100%;margin-top:6px" data-act="logout">登出（換暗號）</button>');

/* ---------- share card ---------- */
function loadImg(src){return new Promise(function(res){var im=new Image();im.onload=function(){res(im);};im.onerror=function(){res(null);};im.src=src;});}
function makeCard(){
  var t=today(), u=uh(t)||{}, ms=mealsOn(t).filter(function(m){return m.photo&&photos[m.photo];}).slice(0,4);
  var W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');
  var gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#FFE7DF');gr.addColorStop(.55,'#FFF3DA');gr.addColorStop(1,'#E9E3FF');g.fillStyle=gr;g.fillRect(0,0,W,H);
  var FN='-apple-system,"PingFang HK",sans-serif';
  g.fillStyle='#2E2A3B';g.textAlign='center';
  g.font='700 64px '+FN;g.fillText('Ming 今日',W/2,170);
  g.font='500 40px '+FN;g.fillStyle='#8C8599';g.fillText(nice(t)+'  🔥 連續 '+streak()+' 日',W/2,235);
  function ring(cx,cy,r,v,col,label,big){
    g.lineWidth=big?40:26;g.strokeStyle='rgba(46,42,59,.08)';g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.stroke();
    if(v!=null){g.strokeStyle=col;g.lineCap='round';g.beginPath();g.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,v/100));g.stroke();}
    g.fillStyle='#2E2A3B';g.font='800 '+(big?130:64)+'px '+FN;g.fillText(v!=null?Math.round(v):'–',cx,cy+(big?45:22));
    g.font='600 '+(big?42:32)+'px '+FN;g.fillStyle='#8C8599';g.fillText(label,cx,cy+r+(big?80:56));
  }
  ring(W/2,540,200,u.sleepScore,'#9B87F5','睡眠分數'+(u.totalSleepMin?' · '+r1(u.totalSleepMin/60)+' 個鐘':''),true);
  ring(300,1000,95,u.recovery,'#FF7A6B','恢復');
  ring(780,1000,95,u.movement,'#4FBDEB','活動');
  var mood=state.moods[t];
  var cc=myCat();
  var catUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(catSVG(cc.coat,cc.acc,catFace()));
  return Promise.all([loadImg(catUrl)].concat(ms.map(function(m){return loadImg(photos[m.photo]);}))).then(function(all){
    var cat=all[0], ims=all.slice(1);
    if(cat)g.drawImage(cat,W/2-110,900,220,237);
    ims=ims.filter(Boolean);
    var top=1200,size=ims.length<=1?560:420,gap=24,cols=ims.length<=1?1:2;
    var x0=(W-(cols*size+(cols-1)*gap))/2;
    ims.forEach(function(im,i){
      var x=x0+(i%cols)*(size+gap),y=top+Math.floor(i/cols)*(size+gap);if(ims.length===3&&i===2)x=(W-size)/2;
      g.save();roundRect(g,x,y,size,size,40);g.clip();
      var s=Math.max(size/im.width,size/im.height);g.drawImage(im,x+(size-im.width*s)/2,y+(size-im.height*s)/2,im.width*s,im.height*s);g.restore();
    });
    if(!ims.length){g.font='600 44px '+FN;g.fillStyle='#8C8599';g.fillText('今日未影食物相 📷',W/2,1400);}
    g.font='500 32px '+FN;g.fillStyle='#8C8599';g.fillText('我同喵喵嘅今日 · Ming 今日',W/2,H-70);
    return c;
  });
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
var cardBlob=null;
function openShare(){
  openSheet(head('✨ 今日分享卡')+'<div class="spinner"><span class="bob">🎨</span><p>砌緊張卡</p></div>');
  makeCard().then(function(c){
    var url=c.toDataURL('image/png');
    c.toBlob(function(b){cardBlob=b;});
    openSheet(head('✨ 今日分享卡')+'<img class="sharebig" id="cardImg" src="'+url+'" alt="今日分享卡"><p class="moodnote">想 share 先 share，唔 share 都得 😉 · iPhone 亦可以長按張圖儲存</p><div class="btnrow"><button class="btn fun" data-act="doShare">📤 分享 / 儲存</button></div>');
  });
}
function doShare(){
  if(!cardBlob)return;
  var file=new File([cardBlob],'ming-'+today()+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(cardBlob);a.download=file.name;a.click();}
}

/* ---------- confetti ---------- */
function confetti(){
  var c=$('fx'),g=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  var cols=['#FF7A6B','#FFB940','#9B87F5','#4FBDEB','#FF8FBF'],ps=[];
  for(var i=0;i<110;i++)ps.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[i%5],a:Math.random()*6,life:0});
  var n=0;(function f(){g.clearRect(0,0,c.width,c.height);ps.forEach(function(p){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);g.restore();});
    if(++n<90)requestAnimationFrame(f);else g.clearRect(0,0,c.width,c.height);})();
}

/* ---------- chat（問 Eva）---------- */
var chatOpen=false, chatMsgs=[], chatImg=null;
function openChat(){
  chatOpen=true;
  openSheet(head('💬 問 Eva')+'<div class="msgs" id="msgs"></div><div id="chatImgPrev"></div><div class="compose"><button data-act="chatPic" aria-label="影相">📷</button><textarea id="chatTx" placeholder="例：午餐食咗叉燒飯＋凍檸茶"></textarea><button class="send" data-act="chatSend" aria-label="傳送">➤</button></div>');
  loadChat();
}
function renderChat(){
  var el=$('msgs');if(!el)return;
  if(!chatMsgs.length){el.innerHTML='<div class="empty">可以同 Eva 講食咗乜、影相、或者問嘢 😊</div>';return;}
  el.innerHTML=chatMsgs.map(function(m){
    var cls=m.role==='user'?'me':'eva';if(m.status==='pending'||m.status==='working')cls+=' wait';
    var th=m.meta&&m.meta.thumb?'<img src="'+m.meta.thumb+'">':'';
    return '<div class="msg '+cls+'">'+th+esc(m.text||'')+(m.role==='user'&&(m.status==='pending'||m.status==='working')?'\n⏳ Eva 睇緊…':'')+'</div>';
  }).join('');
  el.scrollTop=el.scrollHeight;
}
function loadChat(){
  if(DEMO){chatMsgs=[{role:'eva',text:'我係 Eva（示範模式）👋 真版會幫你入數同答問題。',status:'done'}];renderChat();return;}
  fetch(SB+'/rest/v1/ming_chat?select=id,role,text,status,meta->thumb,created_at&order=id.desc&limit=30',{headers:hdr()}).then(function(r){return r.json();}).then(function(rs){
    chatMsgs=(rs||[]).reverse().map(function(m){return {id:m.id,role:m.role,text:m.text,status:m.status,meta:{thumb:m.thumb}};});renderChat();
  }).catch(function(){});
}
function chatSend(){
  var tx=($('chatTx').value||'').trim(); if(!tx&&!chatImg)return;
  var meta={}; if(chatImg){meta.image=chatImg.big;meta.thumb=chatImg.thumb;}
  $('chatTx').value=''; $('chatImgPrev').innerHTML='';
  chatMsgs.push({role:'user',text:tx||'（相）',status:'pending',meta:{thumb:meta.thumb}}); renderChat();
  chatImg=null;
  if(DEMO)return;
  fetch(SB+'/rest/v1/ming_chat',{method:'POST',headers:hdr(),body:JSON.stringify({role:'user',text:tx||'（相）',status:'pending',meta:meta})}).catch(function(){toast('傳送唔到，再試一次');});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act],[data-tab]'); if(!b)return;
  if(b.hasAttribute('data-tab')){tab=b.getAttribute('data-tab');if(tab==='fun')loadDuo();render();scrollTo(0,0);return;}
  var a=b.getAttribute('data-act'), i=+b.getAttribute('data-i');
  if(a==='close')closeSheet();
  else if(a==='cam')$('camIn').click();
  else if(a==='lib')$('libIn').click();
  else if(a==='type')startType();
  else if(a==='typeGo')typeGo();
  else if(a==='mood'){var m=MOODS[i];mutate(function(s){s.moods[today()]={e:m[0],label:m[1],time:nowT()};});b.classList.add('pop');toast(m[0]+' 收到！');}
  else if(a==='water'){var n=+b.getAttribute('data-n'),cur=state.water[today()]||0,v=n===cur?n-1:n;mutate(function(s){s.water[today()]=v;});if(v===state.settings.waterGoal){confetti();toast('💧 今日飲夠水！');}}
  else if(a==='dslot'){draft.slot=b.getAttribute('data-s');showDraft();}
  else if(a==='g'){draftGrams(i,draft.items[i].grams+(+b.getAttribute('data-d')));showDraft();}
  else if(a==='drm'){draft.items.splice(i,1);showDraft();}
  else if(a==='dsave')saveDraft();
  else if(a==='meal')openMeal(b.getAttribute('data-id'));
  else if(a==='heart'){var id=b.getAttribute('data-id');mutate(function(s){s.meals.forEach(function(m){if(m.id===id)m.heart=!m.heart;});});openMeal(id);}
  else if(a==='mdel'){var id2=b.getAttribute('data-id');if(b.getAttribute('data-sure')){mutate(function(s){s.meals=s.meals.filter(function(m){return m.id!==id2;});});closeSheet();toast('刪咗');}else{b.setAttribute('data-sure','1');b.textContent='再撳一下確認刪走';}}
  else if(a==='detail')openDetail();
  else if(a==='saveBody'){var w=parseFloat($('inW').value),bf=parseFloat($('inB').value);if(!w&&!bf)return;mutate(function(s){if(w)s.weights[today()]=w;if(bf)s.bf[today()]=bf;});toast('記低咗 ✅');openDetail();}
  else if(a==='settings')openSettings();
  else if(a==='saveSet'){var num=function(id){var v=parseFloat($(id).value);return isNaN(v)?null:v;};
    mutate(function(s){var t=s.settings;t.name=$('sName').value.trim()||'曉明';t.dailyKcal=num('sKcal');t.proteinTarget=num('sProt');t.waterGoal=num('sWater')||8;t.sleepGoalH=num('sSleep')||7;t.goalKg=num('sGoalKg');t.goalBf=num('sGoalBf');});closeSheet();toast('儲存咗 ✅');}
  else if(a==='logout'){try{localStorage.removeItem('mingKey');localStorage.removeItem('mingCache');}catch(x){}location.reload();}
  else if(a==='share')openShare();
  else if(a==='doShare')doShare();
  else if(a==='duoOn'){mutate(function(s){s.settings.duo.sleep=true;});toast('👨‍👧 加入咗！');}
  else if(a==='duoOff'){mutate(function(s){s.settings.duo.sleep=false;});toast('已退出，唔再分享');}
  else if(a==='pet'){b.classList.remove('bounce');void b.offsetWidth;b.classList.add('bounce');toast(['喵喵：喵～ 😽','喵喵：咕嚕咕嚕…','喵喵：再摸多下 🐾','喵喵：今日都要開心！'][Math.floor(Math.random()*4)]);}
  else if(a==='wear'){var id3=b.getAttribute('data-id'),k=b.getAttribute('data-k');mutate(function(s){if(k==='coat')s.settings.catCoat=id3;else s.settings.catAcc=id3;});toast('喵喵換好衫喇 😸');}
  else if(a==='lockedItem'){toast('🔒 完成多啲挑戰，喵喵就有新嘢著');}
  else if(a==='chatPic')$('chatIn').click();
  else if(a==='chatSend')chatSend();
});
document.addEventListener('input',function(e){
  var el=e.target,a=el.getAttribute('data-act'),i=+el.getAttribute('data-i');
  if(a==='gi'){draftGrams(i,+el.value||0);var sm=el.closest('.row').querySelector('small');if(sm)sm.textContent=Math.round(draft.items[i].kcal)+' kcal';}
  else if(a==='self'){draft.items[i].selfKcal=+el.value||null;var tot=0;draft.items.forEach(function(it){tot+=it.kcal!=null?it.kcal:(it.selfKcal||0);});var sb=document.querySelector('[data-act=dsave]');if(sb)sb.textContent='✓ 入數（大約 '+Math.round(tot)+' kcal）';}
});
$('veil').addEventListener('click',closeSheet);
$('camIn').addEventListener('change',function(){if(this.files[0])startPhoto(this.files[0]);this.value='';});
$('libIn').addEventListener('change',function(){if(this.files[0])startPhoto(this.files[0]);this.value='';});
$('chatIn').addEventListener('change',function(){var f=this.files[0];this.value='';if(!f)return;Promise.all([shrink(f,1280,.8),shrink(f,300,.7)]).then(function(r){chatImg={big:r[0],thumb:r[1]};$('chatImgPrev').innerHTML='<img src="'+r[1]+'" style="height:60px;border-radius:10px;margin:0 0 8px">';});});
$('fab').addEventListener('click',openChat);

/* ---------- boot ---------- */
function showApp(){['app','tabs','fab'].forEach(function(id){$(id).classList.remove('hide');});$('gate').classList.add('hide');}
function showGate(err){$('gate').classList.remove('hide');$('gateErr').textContent=err||'';['app','tabs','fab'].forEach(function(id){$(id).classList.add('hide');});}
$('gateGo').addEventListener('click',function(){KEY=$('gateKey').value.trim();if(!KEY)return;try{localStorage.setItem('mingKey',KEY);}catch(e){}boot();});
$('gateKey').addEventListener('keydown',function(e){if(e.key==='Enter')$('gateGo').click();});

function demoState(){
  var s=defaults({}), t=today();
  for(var i=0;i<21;i++){var d=shift(t,-i),r=Math.sin(i*1.7);
    s.uh.days[d]={demo:true,recovery:Math.round(72+r*14),sleepScore:Math.round(78+Math.cos(i*1.3)*12),movement:Math.round(65+r*18),totalSleepMin:Math.round(420+Math.cos(i*1.3)*55),deepMin:82,remMin:95,lightMin:230,efficiency:89,cycles:5,rhr:58,hrv:62,spo2:97,skinTemp:34.1,steps:Math.round(8200+r*3000),activeMin:48};
    if(i%2===0||i<6)s.moods[d]={e:MOODS[Math.abs(Math.round(r*2))+(Math.cos(i*1.3)<-.3?2:0)][0],label:'',time:'09:00'};
    s.water[d]=i===0?3:(i%3?8:5);
    if(i>0&&i<7)s.meals.push({id:'dm'+i,date:d,time:'13:00',slot:'午',items:[{name:'白飯',grams:180,kcal:234,emoji:['🍜','🍱','🥗','🍣','🥪','🍛'][i%6]}],heart:i===3});
  }
  s.meals.push({id:'dm0',date:t,time:'08:30',slot:'早',items:[{name:'乳酪',grams:150,kcal:90,protein:15,carb:6,fat:0,fiber:0,emoji:'🥣'}]});
  s.meals.push({id:'dm00',date:t,time:'13:10',slot:'午',items:[{name:'叉燒飯',grams:400,kcal:620,protein:28,carb:88,fat:17,fiber:2,emoji:'🍱'}]});
  s.uh.lastSync=new Date().toISOString();
  for(var j=0;j<5;j++)s.badges.push({key:'demo'+j,id:'mood7',ic:['😊','📸','💧','🌙','👟'][j],name:'示範',date:shift(t,-j*3)});
  s.settings.catAcc='bow';
  return s;
}
function boot(){
  if(DEMO){state=demoState();lastTs='demo';showApp();render();setSync('示範模式·唔會儲');return;}
  if(!KEY){showGate('');return;}
  try{var c=JSON.parse(localStorage.getItem('mingCache')||'null');if(c&&c.state&&!state){state=defaults(c.state);lastTs=c.ts;showApp();render();}}catch(e){}
  fetchRow().then(function(rs){
    if(!rs.length){try{localStorage.removeItem('mingKey');localStorage.removeItem('mingCache');}catch(e){}KEY='';state=null;showGate('暗號唔啱，再試一次');return;}
    state=defaults(rs[0].state);lastTs=rs[0].updated_at;cacheSave();showApp();render();setSync('已同步 '+nowT());
    loadPhotos(shift(today(),-30),today());loadDuo();
  }).catch(function(){if(state){setSync('離線，用緊上次嘅資料');}else showGate('連唔到網絡，遲啲再試');});
}
setInterval(poll,5000);
setInterval(function(){if(chatOpen)loadChat();},3000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){poll();checkVer();}});
function checkVer(){if(DEMO)return;fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var m=t.match(/APP_VER='([^']+)'/);if(m&&m[1]!==APP_VER)toast('🔄 有新版本，關咗 app 再開就得');}).catch(function(){});}
boot();
})();
